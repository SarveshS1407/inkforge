<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="oxbloodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A1208" />
      <stop offset="50%" stop-color="#8A2B18" />
      <stop offset="100%" stop-color="#2D0A04" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF2DB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#oxbloodGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Central Foliate Book Spine & Leaves -->
  <g filter="url(#shadow)" transform="translate(106, 96)">
    <!-- Book Leaves Base -->
    <path d="M150 20 C180 50 250 45 280 20 L280 260 C250 280 180 285 150 260 C120 285 50 280 20 260 L20 20 C50 45 120 50 150 20 Z" fill="#F7F2E7" stroke="url(#goldGrad)" stroke-width="4" />
    
    <!-- Spine Center Division -->
    <line x1="150" y1="20" x2="150" y2="260" stroke="#8A2B18" stroke-width="5" stroke-linecap="round" />
    
    <!-- Page Ribbons & Lines Left -->
    <line x1="45" y1="80" x2="125" y2="80" stroke="#8A2B18" stroke-width="3" stroke-opacity="0.5" stroke-linecap="round" />
    <line x1="45" y1="120" x2="125" y2="120" stroke="#8A2B18" stroke-width="3" stroke-opacity="0.5" stroke-linecap="round" />
    <line x1="45" y1="160" x2="110" y2="160" stroke="#8A2B18" stroke-width="3" stroke-opacity="0.5" stroke-linecap="round" />
    <line x1="45" y1="200" x2="125" y2="200" stroke="#8A2B18" stroke-width="3" stroke-opacity="0.5" stroke-linecap="round" />

    <!-- Page Ribbons & Lines Right -->
    <line x1="175" y1="80" x2="255" y2="80" stroke="#8A2B18" stroke-width="3" stroke-opacity="0.5" stroke-linecap="round" />
    <line x1="175" y1="120" x2="255" y2="120" stroke="#8A2B18" stroke-width="3" stroke-opacity="0.5" stroke-linecap="round" />
    <line x1="190" y1="160" x2="255" y2="160" stroke="#8A2B18" stroke-width="3" stroke-opacity="0.5" stroke-linecap="round" />
    <line x1="175" y1="200" x2="255" y2="200" stroke="#8A2B18" stroke-width="3" stroke-opacity="0.5" stroke-linecap="round" />

    <!-- Central Scribe Quill / Nib Emblem -->
    <path d="M150 70 L165 140 L150 170 L135 140 Z" fill="url(#goldGrad)" />
    <line x1="150" y1="70" x2="150" y2="140" stroke="#4A1208" stroke-width="2" />
    <circle cx="150" cy="142" r="3" fill="#4A1208" />
  </g>

  <!-- Title Mark -->
  <text x="256" y="435" text-anchor="middle" font-family="serif" font-size="34" font-weight="bold" letter-spacing="6" fill="url(#goldGrad)">INKFORGE</text>
  <text x="256" y="465" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" letter-spacing="4" fill="#E8D8B0" opacity="0.8">EDITION FOLIO</text>
</svg>